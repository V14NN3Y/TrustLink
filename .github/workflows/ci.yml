name: CI

# Runs on every push to main/dev and on every pull request targeting them.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ${{ matrix.app }} (lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [buyer, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      # Dummy values: the build only needs them to exist, nothing is contacted.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  tests:
    name: Product import + payment logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Product import tests
        working-directory: scripts
        run: node --test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: verify-payment tests
        run: deno test supabase/functions/verify-payment/logic.test.ts